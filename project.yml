name: Mimi
options:
  bundleIdPrefix: com.example
targets:
  Mimi:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Mimi]          # папка с вашими .swift файлами и Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mimi
        INFOPLIST_FILE: Mimi/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
